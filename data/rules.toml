# Tunable rules parameters for the Flames of Orion sim (foosim).
#
# Edit values here to playtest rule changes, or deep-merge overrides at runtime
# (foosim-analyze --override DOTTED.PATH=VALUE). See PLAN.md.
#
# Numbers transcribed from the Free Edition (v10.10) for interoperability.
# Game mechanics/numbers are not copyrightable; no rulebook text or art is
# reproduced here. Flames of Orion is (c) 2025 Stephen Hupfer -- underthedice.com
#
# Dice notation in string fields: "N" fixed, "dN" one die, "MdN" M dice summed,
# "1d3"/"1d2" the usual sub-d6 dice.

[meta]
edition = "free-10.10"
hex_per_inch = 1          # 1 tabletop inch == this many hexes

[game]
rounds = 5
actions_per_activation = 2
starting_platform_slots = 4
max_platform_slots = 8
mech_cost = 50000
quick_play_credits = 25000
veteran_credits = 150000
# The round is a data-driven pipeline (engine/phases.py). Reorder or insert
# phases here to playtest structural rule changes -- e.g. a bonus end-of-round
# close-combat phase:  ["initiative", "activation", "bonus_melee", "heat"]
phase_order = ["initiative", "activation", "heat"]

[visibility]
# See engine/visibility.py and RULES.md 5.1.
mode = "multiray_2d"          # multiray_2d | strict_center | center_25d
eye_height = 1.0             # observer eye height above its hex column (center_25d)
model_height = 1.0          # target height; also the "grazing" band for cover
sample_corner_fraction = 0.85  # 0..1: how far sample points sit toward hex corners
                               # (higher = more "see around the corner")

[to_hit]
always_miss_roll = 1
always_crit_roll = 6
long_range_inches = 10           # strictly greater than this -> Long Range
long_range_cs_penalty = 1        # worsens the CS target number
snap_shot_cs_penalty = 1
focused_cs_bonus = 1             # Focused Fire / Focused Strike
cover_ar_bonus = 1
ar_always_saves_on = 6           # natural d6 that always saves regardless of AP
crit_bonus_damage = 1
catastrophic_bonus_damage = 1    # inherent +1 on any catastrophic result

[heat]
second_action = 1
per_bolstered_action = 1
# overheat: heat >= heat_limit -> hp set to 0 -> explode check

[heat.check_default]             # d6 -> heat gained
"1" = 2
"2" = 1
"3" = 1
"4" = 1
"5" = 0
"6" = 0

[heat.check_heat_sink]           # 'Heat Sink' upgrade
"1" = 2
"2" = 1
"3" = 0
"4" = 0
"5" = 0
"6" = 0

[purge_heat]
dice = "1d3"                     # standard Purge HEAT
reboot_dice = "2d3"             # bolstered 'Reboot' (must be model's only action)

[explode]
out_of_action_rolls = [1, 2]
explode_rolls = [3, 4, 5, 6]
damage_divisor = 2              # damage = floor(heat / divisor)
min_damage = 1
# radius (in inches) == current heat

